<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; worker-src 'self' blob:;"
    />
    <title>Vessel Propulsion System</title>
  </head>
  <div class="window">
    <div class="window-content">
      <div class="pane-group">
        <div class="pane-one-fourth sidebar">
          <p id="clock"><p/>
          <div class="btn-group center">
            <button class="btn btn-default btn-large disabled" id="button-mode-man">
              Manual
            </button>
            <button class="btn btn-default btn-large disabled" id="button-mode-gps">
              GPS
            </button>
            <button class="btn btn-default btn-large disabled" id="button-mode-cfg">
              Config
            </button>
          </div>
          <br />
          <div id="sidebar-content">
          </div>
        </div>
        <div class="pane" id="map"></div>
      </div>
    </div>
    <footer class="toolbar toolbar-footer">
      <div id="board-status" class="footer-left">
        Board not detected: Check connection with board
      </div>
      <div id="gps-info" class="footer-center">
        GPS: Connecting...
      </div>
      <div id="tracking-status" class="footer-right">
      </div>
    </footer>
  </div>
  <script src="index.js"></script>
</html>
